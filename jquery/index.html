<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background: #f3f6fb;
        }

        .topbar {
            background: #111827;
            color: white;
            padding: 15px 25px;
        }

        .main {
            padding: 20px;
        }

        .card-box {
            padding: 20px;
            border-radius: 18px;
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .1);
        }

        .balance-card {
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }

        .income-card {
            background: linear-gradient(135deg, #10b981, #047857);
        }

        .expense-card {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
        }

        .amount {
            font-size: 28px;
            font-weight: bold;
        }

        .section-box {
            background: white;
            padding: 20px;
            border-radius: 18px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .06);
        }

        .btn-custom {
            background: #2563eb;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background: #1d4ed8;
            color: white;
        }

        .table thead {
            background: #111827;
            color: white;
        }

        .income-text {
            color: green;
            font-weight: bold;
        }

        .expense-text {
            color: red;
            font-weight: bold;
        }

        .delete-btn {
            cursor: pointer;
            color: red;
        }

        .chart-box {
            width: 260px;
            height: 260px;
            margin: auto;
        }

        .note-card {
            background: #fff9c4;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }

        /* ADD THIS CSS */

        .chart-box {
            width: 250px;
            height: 250px;
            margin: auto;
        }

        .bar-chart-box {
            width: 100%;
            height: 300px;
        }

        @media(max-width:768px) {

            .chart-box {
                width: 200px;
                height: 200px;
            }

            .bar-chart-box {
                height: 250px;
            }

        }

        @media(max-width:768px) {
            .chart-box {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <!-- TOPBAR -->
    <div class="topbar d-flex justify-content-between align-items-center flex-wrap">

        <h4>
            <i class="fa-solid fa-wallet"></i>
            Money Tracker
        </h4>

        <span id="todayDate"></span>

    </div>

    <div class="main container-fluid">

        <!-- CARDS -->
        <div class="row g-4">

            <div class="col-md-4">
                <div class="card-box balance-card">
                    <h5>Total Balance</h5>
                    <div class="amount">₹ <span id="balance">0</span></div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-box income-card">
                    <h5>Total Income</h5>
                    <div class="amount">₹ <span id="income">0</span></div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card-box expense-card">
                    <h5>Total Expense</h5>
                    <div class="amount">₹ <span id="expense">0</span></div>
                </div>
            </div>

        </div>

        <!-- FORM -->
        <div class="section-box">

            <h4 class="mb-4">Add Transaction</h4>

            <div class="row g-3">

                <div class="col-md-3">
                    <input type="number" id="amount" class="form-control" placeholder="Amount">
                </div>

                <div class="col-md-2">
                    <select id="type" class="form-select">
                        <option value="">Choose</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <input type="text" id="note" class="form-control" placeholder="Enter notes">
                </div>

                <div class="col-md-2">
                    <input type="date" id="date" class="form-control">
                </div>

                <div class="col-md-2">
                    <button class="btn btn-custom w-100" id="addBtn">
                        Add
                    </button>
                </div>

            </div>

        </div>

        <!-- CHART -->
        <!-- CHART SECTION -->

        <div class="section-box text-center">

            <h4 class="mb-4">Overview</h4>

            <div class="row g-4 justify-content-center align-items-center">

                <!-- Doughnut Chart -->
                <div class="col-md-4">

                    <div class="chart-box">
                        <canvas id="myChart"></canvas>
                    </div>

                    <h6 class="mt-3">Income vs Expense</h6>

                </div>

                <!-- Bar Chart -->
                <div class="col-md-6">

                    <div class="bar-chart-box">
                        <canvas id="barChart"></canvas>
                    </div>

                    <h6 class="mt-3">Analytics</h6>

                </div>

            </div>

        </div>
        <!-- TABLE -->
        <div class="section-box">

            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">

                <h4>History</h4>

                <input type="text" id="search" class="form-control w-auto" placeholder="Search">

            </div>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>
                        <tr>
                            <th>Amount</th>
                            <th>Type</th>
                            <th>Notes</th>
                            <th>Date</th>
                            <th>Delete</th>
                        </tr>
                    </thead>

                    <tbody id="tableBody"></tbody>

                </table>

            </div>

        </div>

    </div>

    <script>

        let transactions = JSON.parse(localStorage.getItem("transactions")) || [];
        function updateUI() {
            let income = 0;
            let expense = 0;
            $("#tableBody").html("");
            transactions.forEach((item, index) => {
                if (item.type == "income") {
                    income += Number(item.amount);
                } else {
                    expense += Number(item.amount);
                }

                $("#tableBody").append(`
                    <tr>
                        <td>₹ ${item.amount}</td>
                        <td class="${item.type == 'income' ? 'income-text' : 'expense-text'}">
                            ${item.type}
                        </td>
                        <td>${item.note}</td>
                        <td>${item.date}</td>
                        <td>
                            <i class="fa-solid fa-trash delete-btn"
                                onclick="deleteItem(${index})"></i>
                        </td>
                    </tr>
                `)
            })
            $("#income").text(income);
            $("#expense").text(expense);
            $("#balance").text(income - expense);
            localStorage.setItem("transactions", JSON.stringify(transactions));
            updateChart(income, expense);
        }

        $("#addBtn").click(function () {
            let amount = $("#amount").val();
            let type = $("#type").val();
            let note = $("#note").val();
            let date = $("#date").val();
            if (!amount || !type || !note || !date) {
                alert("Fill all fields");
                return;
            }
            let obj = {
                amount,
                type,
                note,
                date
            }
            transactions.push(obj);
            updateUI();
            $("#amount").val("");
            $("#type").val("");
            $("#note").val("");
            $("#date").val("");
        })

        function deleteItem(index) {
            transactions.splice(index, 1);
            updateUI();
        }

        $("#search").on("keyup", function () {
            let value = $(this).val().toLowerCase();
            $("#tableBody tr").filter(function () {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
            })
        })

        // DATE

        let today = new Date();

        $("#todayDate").text(today.toDateString());

        // CHART

        // DOUGHNUT CHART

        let ctx = document.getElementById('myChart');

        let myChart = new Chart(ctx, {

            type: 'doughnut',

            data: {

                labels: ['Income', 'Expense'],

                datasets: [{
                    data: [0, 0],
                    backgroundColor: [
                        '#10b981',
                        '#ef4444'
                    ]
                }]

            },

            options: {
                responsive: true,
                maintainAspectRatio: false
            }

        });


        // BAR CHART

        let bar = document.getElementById('barChart');

        let barChart = new Chart(bar, {

            type: 'bar',

            data: {

                labels: ['Income', 'Expense', 'Balance'],

                datasets: [{

                    label: 'Money Analytics',

                    data: [0, 0, 0],

                    backgroundColor: [
                        '#10b981',
                        '#ef4444',
                        '#2563eb'
                    ],

                    borderRadius: 10

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false

            }

        });


        // UPDATE BOTH CHARTS

        function updateChart(income, expense) {

            // Doughnut

            myChart.data.datasets[0].data = [income, expense];

            myChart.update();


            // Bar

            barChart.data.datasets[0].data = [

                income,
                expense,
                income - expense

            ];

            barChart.update();

        }
        updateUI();

    </script>

</body>

</html>
