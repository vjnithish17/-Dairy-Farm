<head>

</head>

<body>
    <nav class="navbar navbar-expand-lg topbar">
        <div class="container-fluid">

            <a class="navbar-brand text-white fw-bold" href="#">
                Dairy Farm <br>Management</br>
            </a>

            <!-- THREE DOT / TOGGLE -->
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- NAVBAR CONTENT -->
            <div class="collapse navbar-collapse justify-content-between" id="navbarContent">

                <ul class="navbar-nav mx-auto gap-3">

                    <li class="nav-item">
                        <a href="./dashboard.html" class="nav-link ">Dashboard</a>
                    </li>

                    <li class="nav-item">
                        <a href="./addcow.html" class="nav-link">Add Cow</a>
                    </li>

                    <li class="nav-item">

                    <li class="nav-item">

                    </li>

                    <li class="nav-item">
                        <a href="./reports.html" class="nav-link">Reports</a>
                    </li>

                </ul>

                <div class="d-flex align-items-center gap-3 flex-wrap">

                    <h5 id="clock" class="m-0 text-white"></h5>

                    <span class="admin-name" id="admin">Admin</span>

                    <button class="btn btn-light" id="modeBtn">
                        <i class="fa-solid fa-moon"></i>

                    <div class="logout" id="log">
                        <i class="fa-solid fa-right-from-bracket"></i>

    <div class="container-fluid ">
        <div class="row g-4 main-layout">
            <!-- LEFT SIDE -->
            <div class="col-lg-4">
                <div class="left-panel shadow p-3  d-flex flex-column justify-content-between">
                    <!-- FORM -->
                    <div>
                        <h3 class="mb-4">Daily Expense Entry</h3>
                        <form id="exrest">
                            <div class="mb-3">
                                <select id="expenseType" class="form-control">
                                    <option value="">Select Expense</option>
                                    <option value="Food">Food</option>
                                    <option value="Milk">Milk</option>
                                    <option value="Medicine">Medicine</option>
                                    <option value="Labour">Labour</option>
                                    <option value="Electricity">Electricity</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <input type="number" id="expenseAmount" class="form-control" placeholder="Enter Amount">
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                Submit Expense
                            </button>
                        </form>
                    </div>

                    <div class="">
                        <div class="card bg-danger text-white total-card shadow border-0">
                            <div class="card-body d-flex flex-column justify-content-center align-items-center">
                                <h4>Total Expense</h4>
                                <h1 id="totalExpense">₹</h1>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- RIGHT SIDE TABLE -->
            <div class="col-lg-8">
                <div class="table-side ">
                    <div class="table-scroll">
                        <table class="table table-bordered table-hover align-middle text-center mb-0">
                            <thead class="table-dark sticky-top">
                                <tr>
                                    <th>Date</th>
                                    <th>Expense Type</th>
                                    <th>Amount</th>
                                    <th>Update</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>
                            <tbody id="expenseTable">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        © 2026 All Rights Reserved | Designed & Developed by SDLC Trichy
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>

        // // expense------------------------------------------------------------
        let editIndex = null;
        let totalex = JSON.parse(localStorage.getItem("expenseamount")) || [];
        let form1 = document.getElementById("exrest")
        form1.addEventListener("submit", (e) => {
            e.preventDefault()
            debugger
            let type = document.getElementById("expenseType").value;
            let amount = (document.getElementById("expenseAmount").value);

            if (type == "") {
                Swal.fire({
                    title: "Warning!",
                    text: "Select Expense Type",
                    icon: "warning"
                });
                return;
            }

            if (amount == "") {
                Swal.fire({
                    title: "Warning!",
                    text: "Enter Amount",
                    icon: "warning"
                });
                return;
            }
            let expenses = {
                type,
                amount,
                date: new Date().toISOString().split("T")[0]
            }

            if (editIndex == null) {
                totalex.push(expenses)
                localStorage.setItem("expenseamount", JSON.stringify(totalex));
                Swal.fire({
                    title: " Success !",
                    text: "Expense  Added Successfully",
                    icon: "success",
                    timer: 1500,
                    showConfirmButton: false
                });

            } else {
                let totalex = JSON.parse(localStorage.getItem("expenseamount")) || [];
                let updatearr = totalex.map((ele, index) => {
                    if (editIndex == index) {
                        return expenses
                    } else {
                        return ele;
                    }

                })
                localStorage.setItem("expenseamount", JSON.stringify(updatearr));
                // alert("update suceesfully")
                Swal.fire({
                    title: "Updated!",
                    text: "Expense Updated Successfully",
                    icon: "success",
                    timer: 1500,
                    showConfirmButton: false
                });
                  editIndex=null
            }
            document.getElementById("exrest").reset();
            showexpense()
        })
        // Always show content

        let showexpense = () => {
            let totalex = JSON.parse(localStorage.getItem("expenseamount")) || [];
            let table = document.getElementById("expenseTable");
            let total = 0;

            table.innerHTML = ""
            totalex.forEach((exp, index) => {
                total += Number(exp.amount);
                table.innerHTML += `
        <tr>
            <td>${exp.date}</td>
            <td>${exp.type}</td>
            <td>₹${exp.amount}</td>
            <td><button class="btn" onclick="updateexpense(${index})"><i class="fa fa-pencil" aria-hidden="true"></i></button></td>
             <td><button  class="btn"onclick="deleteexpense(${index})"><i class="fa fa-trash" aria-hidden="true"></i></button></td>
        </tr>`;
            });
            document.getElementById("totalExpense").innerHTML = `₹${total}`;
        };
        showexpense();



        let deleteexpense = (index) => {
            Swal.fire({
                title: "Are you sure?",
                text: "This expense will be deleted!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#d33",
                confirmButtonText: "Yes, Delete"
            }).then((result) => {
                if (result.isConfirmed) {
                    // ---------------------------------------------------------------------
                    let totalex = JSON.parse(localStorage.getItem("expenseamount")) || [];

                    let expensearr = totalex.filter((ele, idx) => idx != index);

                    localStorage.setItem("expenseamount", JSON.stringify(expensearr));

                    showexpense();

                    Swal.fire({
                        title: "Deleted!",
                        text: "Expense Deleted Successfully",
                        icon: "success",
                        timer: 1500,
                        showConfirmButton: false
                    });
                }
            });
        }
        let updateexpense = (index) => {
            let totalex = JSON.parse(localStorage.getItem("expenseamount")) || [];
            let filerexpense = totalex.filter((ele, idx) => idx == index)
            let [obj] = filerexpense
            console.log(filerexpense);
            document.getElementById("expenseType").value = obj.type
            document.getElementById("expenseAmount").value = obj.amount
            editIndex = index;

        }
        // 

        let btn = document.getElementById("modeBtn");

        btn.addEventListener("click", () => {

            document.body.classList.toggle("dark");

            if (document.body.classList.contains("dark")) {

                btn.innerHTML = `<i class="fa-solid fa-moon"></i>`

            } else {
                btn.innerHTML = `<i class="fa-solid fa-sun"></i>`

                // btn.innerHTML = "🌙 ";
            }
        });





        let admin = document.getElementById("admin")
        let userslist = JSON.parse(localStorage.getItem("userslist")) || []
        let username = userslist.map((ele) => {
            return ele.name
        })

        // console.log(username)
        admin.innerHTML = username



        let logout = document.getElementById("log")
        logout.addEventListener("click", () => {

            Swal.fire({
                title: "Are you sure?",
                text: "You want to logout?",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Yes, Logout"
            }).then((result) => {

                if (result.isConfirmed) {

                    // remove current login user
                    localStorage.removeItem("userlist")

                    Swal.fire({
                        title: "Logged Out!",
                        icon: "success",
                        timer: 1500,
                        showConfirmButton: false
                    })
                    // -----------------------------------------------------
                    setTimeout(() => {
                        window.location.href = "index.html"
                    }, 1500)
                }
            })
        })

    </script>

</body>
