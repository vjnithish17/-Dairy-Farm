<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link rel="icon"
        href="https://cdn.vectorstock.com/i/500p/75/29/holstein-cow-logo-farm-branding-vector-59997529.jpg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container-fluid">
        <!-- Top Navbar -->
        <div class="topbar d-flex justify-content-between align-items-center p-3 ">
            <h4 class="m-0">🐄 Dairy Farm Dashboard</h4>
            <div>
                <h5 id="clock" class="m-0"></h5>
            </div>

            <div class="d-flex align-items-center gap-3">
                <span class="admin-name" id="admin">👤 Admin</span>
                <button class="btn btn-light" id="modeBtn">
                    🌙 Dark
                </button>
            </div>
        </div>


        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-3">
                <ul class="nav flex-column">
                    <li class="nav-item"><a href="./dashboard.html" class="nav-link active">Dashboard</a></li>
                    <li class="nav-item"><a href="./addcow.html" class="nav-link">Add Cow</a></li>
                    <li class="nav-item"><a href="./milkentery.html" class="nav-link">Milk Entry</a></li>
                    <li class="nav-item"><a href="./expense.html" class="nav-link">Expense</a></li>
                    <li class="nav-item"><a href="./reports.html" class="nav-link">Reports</a></li>
                </ul>
            </div>

            <!-- Main -->

            <div class="col-md-10 p-4">
                <h2>Daily Summary</h2>
                <div class="mt-5">
                    <table class="table table-striped mt-3">
                        <thead class="table-dark">
                            <tr>
                                <th>Date</th>
                                <th>Cow/Type</th>
                                <th>Milk</th>
                                <th>Milk Rate </th>
                                <th>Income</th>
                                <th> Expense</th>
                            </tr>
                        </thead>
                        <tbody id="expenseReportTable"></tbody>

                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function report() {
            let totalincome = 0
            let expense = 0
            let totalexpense=0
            let reportExpense = document.getElementById("expenseReportTable");
            let totalex = JSON.parse(localStorage.getItem("expenseamount"));
            let milkEntries = JSON.parse(localStorage.getItem("Milkentry"));

            totalex.forEach(exp => {
                expense += Number(exp.amount)
                reportExpense.innerHTML += `
            <tr>
                <td>${exp.date}</td>
                <td>${exp.type}</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>₹${exp.amount} </td>
            </tr>
        `;
            });
            console.log(reportExpense);

            console.log(totalex);
            // reportExpense.innerHTML = "₹" + totalex;
            milkEntries.forEach(exp => {

                let income = Number(exp.total) * Number(exp.rate)
                
                totalincome += income
                reportExpense.innerHTML += `
            <tr>
                <td>${exp.date}</td>
                <td>${exp.name}</td>
                <td><b>${exp.total} L</b></td>
                <td><b>₹${exp.rate}</b></td>
                <td><b>₹${income} </b></td>
                <td>- </td>
            </tr>
        `;
            });
            let profit = totalincome - expense;
            // Total Income
            reportExpense.innerHTML += `
            <tr class="yellow mt-4">
             <td colspan="3"><b>Total Income</b></td>
            <td><b>₹${totalincome}</b></td>
            
             </tr>
           `;
             reportExpense.innerHTML += `
             <tr class="burble">
            <td colspan="3"><b>Total Expense</b></td>
            <td><b>₹${expense}</b></td>
           
            </tr>
            `;
            reportExpense.innerHTML += `
             <tr class="green">
            <td colspan="3"><b>Total Profit</b></td>
            <td><b>₹${Math.abs(profit)}</b></td>
            
            </tr>
            `;
            let loss = profit - totalincome
            reportExpense.innerHTML += `
             <tr class="red">
            <td colspan="3"><b>Total Loss</b></td>
            <td><b>₹${loss}</b></td>
            
            </tr>
            `;
          

            console.log(loss);


        }
        report();
        // btn
        let btn = document.getElementById("modeBtn")
        btn.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            btn.classList.toggle("bg-dark")
            console.log(btn);

        })
    </script>
</body>

</html>
