<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link rel="icon"
        href="https://cdn.vectorstock.com/i/500p/75/29/holstein-cow-logo-farm-branding-vector-59997529.jpg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container-fluid">
        <!-- Top Navbar -->
        <div class="topbar d-flex justify-content-between align-items-center p-3 ">
            <h4 class="m-0">🐄 Dairy Farm Dashboard</h4>
            <div>
                <h5 id="clock" class="m-0"></h5>
            </div>

            <div class="d-flex align-items-center gap-3">
                <span class="admin-name" id="admin">👤 Admin</span>
                <button class="btn btn-light" id="modeBtn">
                    🌙 Dark
                </button>
            </div>
        </div>


        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-3">
                <ul class="nav flex-column">
                    <li class="nav-item"><a href="./dashboard.html" class="nav-link active">Dashboard</a></li>
                    <li class="nav-item"><a href="./addcow.html" class="nav-link">Add Cow</a></li>
                    <li class="nav-item"><a href="./milkentery.html" class="nav-link">Milk Entry</a></li>
                    <li class="nav-item"><a href="./expense.html" class="nav-link">Expense</a></li>
                    <li class="nav-item"><a href="./reports.html" class="nav-link">Reports</a></li>
                </ul>
            </div>

            <!-- Main -->

            <div class="col-md-10 p-4">
                <h2>Daily Summary</h2>
                <div class="mt-5">
                    <table class="table table-striped mt-3">
                        <thead class="table-dark">
                            <tr>
                                <th>Date</th>
                                <th> Expense</th>
                                <th>Milk</th>
                                <th>Income</th>
                                <th>Profit</th>
                            </tr>
                        </thead>
                        <tbody id="expenseReportTable"></tbody>

                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function report() {
            let reportExpense = document.getElementById("expenseReportTable");
            let totalex = JSON.parse(localStorage.getItem("expenseamount"));
            let milkEntries = JSON.parse(localStorage.getItem("Milkentry"));

            totalex.forEach(exp => {
                reportExpense.innerHTML += `
            <tr>
                <td>${exp.date}</td>
                <td>₹${exp.amount}</td>
            </tr>
        `;
            });
            console.log(reportExpense);
            

            console.log(totalex);
            // reportExpense.innerHTML = "₹" + totalex;
            milkEntries.forEach(exp => {
                reportExpense.innerHTML += `
            <tr>
                <td>${exp.date}</td>
                <td>₹${exp.amount}</td>
                 <td><b>${exp.total} L</b></td>
            </tr>
        `;
            });
        }
        report();

    </script>
</body>

</html>
