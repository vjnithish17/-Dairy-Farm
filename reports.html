    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg topbar">
        <div class="container-fluid">

            <a class="navbar-brand text-white fw-bold" href="#">
                Dairy Farm <br>Management</br>
            </a>

            <!-- THREE DOT / TOGGLE -->
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- NAVBAR CONTENT -->
            <div class="collapse navbar-collapse justify-content-between" id="navbarContent">

                <ul class="navbar-nav mx-auto gap-3">

                    <li class="nav-item">
                        <a href="./dashboard.html" class="nav-link ">Dashboard</a>
                    </li>

                    <li class="nav-item">
                        <a href="./addcow.html" class="nav-link">Add Cow</a>
                    </li>

                    <li class="nav-item">

                    </li>

                    <li class="nav-item">
                        <a href="./expense.html" class="nav-link">Expense</a>
                    </li>

                    <li class="nav-item">
                        <a href="./reports.html" class="nav-link">Reports</a>
                    </li>

                </ul>

                <div class="d-flex align-items-center gap-3 flex-wrap">

                    <h5 id="clock" class="m-0 text-white"></h5>

                    <span class="admin-name" id="admin"></span>
                    <!-- <button class="btn btn-light" id="modeBtn">
                        <i class="fa-solid fa-moon"></i>

        </div>
    </nav>


    <!-- MAIN -->
    <div class="col-md-10 p-4">
        <div class="top-section">
            <div class="chart-box">
                <h2 class="mb-4">Daily Summary</h2>

                <!-- CHART -->
                <div style="height:300px;">
                    <canvas id="reportChart"></canvas>
                </div>
            </div>

            <!-- RIGHT SIDE -->
            <div class="summary-box">
                <button class="btn btn-primary px-4 mb-3 w-100" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> Print Report
                </button>

                <!-- SUMMARY CARD -->
                <div class="card shadow p-1">
                    <h4 class="mb-2">Summary</h4>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Total Milk</span>
                        <b id="totalMilk">0 L</b>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Total Income</span>
                        <b id="totalIncome">₹0</b>
                    </div>
                    <div class="d-flex justify-content-between mb-1">
                        <span>Total Expense</span>
                        <b id="totalExpense">₹0</b>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-3">
                        <span id="p-l">Profit / Loss</span>
                        <b id="profitLoss">₹0</b>
                    </div>
                </div>
            </div>

        </div>

        <!-- TABLE -->
        <div class="mt-4 table-responsive">
            <table class="table table-striped mt-3">

                <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Cow/Type</th>
                        <th>Milk</th>
                        <th>Milk Rate</th>
                        <th>Income</th>
                        <th>Expense</th>
                    </tr>
                </thead>

                <tbody id="expenseReportTable"></tbody>

            </table>
        </div>
    </div>
    <footer>
        © 2026 All Rights Reserved | Crafted & Developed by Nithish | SDLC, Trichy
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        function report() {

            function formatDate(dateValue) {
                let d = new Date(dateValue);
                return `${String(d.getDate()).padStart(2, "0")}-${String(d.getMonth() + 1).padStart(2, "0")}-${d.getFullYear()}`;
            }

            let totalincome = 0
            let expense = 0
            let totalmilk = 0
            let reportExpense = document.getElementById("expenseReportTable");

            let totalex = JSON.parse(localStorage.getItem("expenseamount"));
            totalex.forEach(exp => {
                expense += Number(exp.amount)
                reportExpense.innerHTML += `
            <tr>
                <td>${formatDate(exp.date)}</td>
                <td>${exp.type}</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>₹${exp.amount} </td>
            </tr>
                  `;
            });

            let milkEntries = JSON.parse(localStorage.getItem("Milkentry"));
            milkEntries.forEach(exp => {

                let income = Number(exp.total) * Number(exp.rate)

                totalincome += income
                totalmilk += Number(exp.total)
                reportExpense.innerHTML += `
            <tr>
                <td>${formatDate(exp.date)}</td>
                <td>${exp.name}</td>
                <td><b>${exp.total} L</b></td>
                <td><b>₹${exp.rate}</b></td>
                <td><b>₹${income} </b></td>
                <td>- </td>
            </tr>`;
            });


            // Total Income
            reportExpense.innerHTML += `
            <tr class="yellow mt-4">
              <td colspan="2"><b>Total</b></td>
               <td><b>${totalmilk} L</b></td>
               <td><b></b></td>
               <td><b>₹${totalincome}</b></td>
               <td><b>₹${expense}</b></td>
             </tr>`;


            let profit = 0
            let loss = 0
            let profitLoss = document.getElementById("profitLoss");
            let proloss = document.getElementById("p-l");

            if (totalincome >= expense) {

                let profit = totalincome - expense;
                profitLoss.innerHTML = `+ ₹${profit}`;
                profitLoss.style.color = "green";
                proloss.innerHTML = `Total Profit`
                proloss.style.color = "green";

            } else {
                let loss = expense - totalincome
                profitLoss.innerHTML = `- ₹${loss}`;
                profitLoss.style.color = "red";
                proloss.innerHTML = `Total Loss`
                proloss.style.color = "red";

            }

            let tmilk = document.getElementById("totalMilk")
            tmilk.innerHTML = `${totalmilk} L`;

            let tincom = document.getElementById("totalIncome")
            tincom.innerHTML = `₹${totalincome}`;
            tincom.style.color = `#ccc908`
            let texp = document.getElementById("totalExpense")
            texp.innerHTML = `₹${expense}`;
            texp.style.color = `#0984b4`

            // ==================================---------------------==========================


            // CHART
            // chatgpt
            let proft = totalincome - expense;
            let ctx = document.getElementById("reportChart");
            new Chart(ctx, {

                type: 'bar',

                data: {

                    labels: [
                        'Income',
                        'Expense',
                        'Profit'
                    ],

                    datasets: [{

                        label: 'Amount ₹',

                        data: [
                            totalincome,
                            expense,
                            proft
                        ],

                        backgroundColor: [
                            '#ccc908',
                            '#0984b4',
                            '#08cc08'
                        ],

                        borderRadius: 12,
                        borderWidth: 1,

                        hoverBackgroundColor: [
                            '#ccc908',
                            '#0984b4',
                            '#08cc08'
                        ]
                    }]
                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    plugins: {

                        legend: {
                            display: false
                        },

                        tooltip: {
                            enabled: true
                        }
                    },

                    animation: {

                        duration: 2500,

                        easing: 'easeOutBounce'
                    },

                    scales: {

                        y: {

                            beginAtZero: true,

                            ticks: {
                                stepSize: 500
                            }
                        }
                    }
                }
            });
        }
        report();



        // let btn = document.getElementById("modeBtn");

        // btn.addEventListener("click", () => {

        //     document.body.classList.toggle("dark");

        //     if (document.body.classList.contains("dark")) {

        //         btn.innerHTML = `<i class="fa-solid fa-moon"></i>`

        //     } else {
        //         btn.innerHTML = `<i class="fa-solid fa-sun"></i>`

        //         // btn.innerHTML = "🌙 ";
        //     }
        // });

        let admin = document.getElementById("admin")
        let userslist = JSON.parse(localStorage.getItem("userslist")) || []
        let username = userslist.map((ele) => {
            return ele.name
        })
        admin.innerHTML = username



        let logout = document.getElementById("log")
        logout.addEventListener("click", () => {

            Swal.fire({
                title: "Are you sure?",
                text: "You want to logout?",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Yes, Logout"
            }).then((result) => {

                if (result.isConfirmed) {

                    // remove current login user
                    localStorage.removeItem("userlist")

                    Swal.fire({
                        title: "Logged Out!",
                        icon: "success",
                        timer: 1500,
                        showConfirmButton: false
                    })

                    setTimeout(() => {
                        window.location.href = "index.html"
                    }, 1500)
                }
            })
        })

    </script>
</body>

</html>
