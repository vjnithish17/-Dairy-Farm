<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dairy Farm Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg topbar">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold" href="#">
                Dairy Farm <br>Management</br>
            </a>
            <!-- THREE DOT / TOGGLE -->
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- NAVBAR CONTENT -->
            <div class="collapse navbar-collapse justify-content-between" id="navbarContent">
                <ul class="navbar-nav mx-auto gap-3">
                    <li class="nav-item">
                        <a href="./dashboard.html" class="nav-link ">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="./addcow.html" class="nav-link">Add Cow</a>
                    </li>
                    <li class="nav-item">
                        <a href="./milkentery.html" class="nav-link">Milk Entry</a>
                    </li>
                    <li class="nav-item">
                        <a href="./expense.html" class="nav-link">Expense</a>
                    </li>
                    <li class="nav-item">
                        <a href="./reports.html" class="nav-link">Reports</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <h5 id="clock" class="m-0 text-white"></h5>
                    <span class="admin-name" id="admin">Admin</span>
                    <button class="btn btn-light" id="modeBtn">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <div class="logout" id="log">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="row">
        <!-- Main -->
        <div class="col-md-10 p-4 main-content">
            <h2 class="mb-4">Dashboard</h2>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card-box bg-primary">
                        <h5>Morning Milk</h5>
                        <h2 id="morningMilk">0L</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card-box bg-success">
                        <h5>Evening Milk</h5>
                        <h2 id="eveningMilk">0L</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card-box bg-warning">
                        <h5>Total Milk</h5>
                        <h2 id="totalMilk">0L</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card-box bg-info">
                        <h5>Income</h5>
                        <h2 id="income">₹0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card-box bg-danger">
                        <h5>Expense</h5>
                        <h2 id="expense">₹0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card-box bg-dark">
                        <h5>Profit</h5>
                        <h2 id="profit">₹0</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        © 2026 All Rights Reserved | Crafted & Developed by Nithish | SDLC, Trichy
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function loadDashboard() {

            let milkEntries = JSON.parse(localStorage.getItem("Milkentry")) || []
            let morningTotal = 0
            let eveningTotal = 0
            let totalMilk = 0
            let totalincome = 0


            milkEntries.forEach((milk) => {
                // console.log(milk);
                let income = Number(milk.total) * Number(milk.rate)
                totalincome += income
                morningTotal += Number(milk.morning)
                eveningTotal += Number(milk.evening)
                totalMilk += Number(milk.total)

            })
            // Total Milk × Milk Price------50 L × ₹45 = ₹2250
            document.getElementById("morningMilk").innerText = morningTotal + " L"
            document.getElementById("eveningMilk").innerText = eveningTotal + " L"
            document.getElementById("totalMilk").innerText = totalMilk + " L"
            // ----------------------------------------------------------------------------------------------------------------------------------

            let totalex = JSON.parse(localStorage.getItem("expenseamount")) || [];
            let total = 0;
            totalex.forEach((exp) => {

                // console.log(exp);
                total += Number(exp.amount);
            })
            // Income - Expense------------₹2250 - ₹500 = ₹1750F
            let profit = 0
            profit = totalincome - total
            document.getElementById("expense").innerHTML = "₹" + total
            document.getElementById("income").innerHTML = "₹" + totalincome
            document.getElementById("profit").innerHTML = "₹" + profit
        }
        loadDashboard()
        let btn = document.getElementById("modeBtn");
        btn.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            if (document.body.classList.contains("dark")) {
                btn.innerHTML = `<i class="fa-solid fa-moon"></i>`
            } else {
                btn.innerHTML = `<i class="fa-solid fa-sun"></i>`
                // btn.innerHTML = "🌙 ";
            }
        });

        let admin = document.getElementById("admin")
        let userslist = JSON.parse(localStorage.getItem("userslist")) || []
        let username = userslist.map((ele) => {
            return ele.name
        })

        admin.innerHTML = username

        let logout = document.getElementById("log")
        logout.addEventListener("click", () => {

            Swal.fire({
                title: "Are you sure?",
                text: "You want to logout?",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Yes, Logout"
            }).then((result) => {

                if (result.isConfirmed) {

                    // remove current login user
                    localStorage.removeItem("currentUser")

                    Swal.fire({
                        title: "Logged Out!",
                        icon: "success",
                        timer: 1500,
                        showConfirmButton: false
                    })

                    setTimeout(() => {
                        window.location.href = "index.html"
                    }, 1500)
                }
            })
        })

    </script>
</body>

</html>
