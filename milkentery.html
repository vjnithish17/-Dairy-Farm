<body>

            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarContent">

            <!-- NAVBAR CONTENT -->
            <div class="collapse navbar-collapse justify-content-between" id="navbarContent">

                <ul class="navbar-nav mx-auto gap-3">

                    <li class="nav-item">

                <div class="d-flex align-items-center gap-3 flex-wrap">

    <div class="container-fluid py-4">
        <div class="row g-4 align-items-start">

            <!-- LEFT SIDE FORM -->
            <div class="col-lg-4">
                <div class="cow-form p-4">
                    <h2 class="mb-4">Daily Milk Entry</h2>
                    <form action="" id="rest">
                        <div class="row g-3">
                            <div class="col-12">
                                <select id="milkCowName" class="form-control">
                                    <option value="">Select Cow</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <input type="number" id="morning" class="form-control" placeholder="Morning Milk">
                            </div>
                            <div class="col-6">
                                <input type="number" id="evening" class="form-control" placeholder="Evening Milk">
                            </div>
                            <div class="col-12">
                                <input type="date" id="date" class="form-control">
                            </div>
                            <div class="col-12">
                                <input type="number" id="rate" class="form-control" placeholder="Milk Rate">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-success w-100">
                                    Add Entry
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- RIGHT SIDE TABLE -->
            <div class="col-lg-8 scroll1">
                <div class="table-card p-3">
                    <h4 class="mb-3">Milk Records</h4>
                    <div class="table-responsive custom-scroll">
                        <table class="table table-striped">
                            <thead class="table-dark">
                                <tr>
                                    <th>Date</th>
                                    <th>Cow Name</th>
                                    <th>Morning</th>
                                    <th>Evening</th>
                                    <th>Total</th>
                                    <th>Milk Rate</th>
                                    <th>Income</th>
                                    <th>Update</th>
                                    <th>Delete</th>
                                </tr>
                            </thead>

                            <tbody id="milkTable"></tbody>

                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    <footer>
        © 2026 All Rights Reserved | Crafted & Developed by Nithish | SDLC, Trichy
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>

        // // milkentry---------------------------------------------------------------------

        let editIndex = null;
        // let mainarray=new Array()

        let milkEntries = JSON.parse(localStorage.getItem("Milkentry")) || [];
        function loadCowOptions() {

            let cows = JSON.parse(localStorage.getItem("cows")) || [];
            let select = document.getElementById("milkCowName");
            select.innerHTML = `<option value="">Select Cow</option> `

            cows.forEach((cow) => {
                // console.log(cow);
                select.innerHTML += `
            <option value="${cow.cowName}">
                ${cow.cowName}
            </option>`

            });
            // console.log(select);

        }

        let form1 = document.getElementById("rest")

        form1.addEventListener("submit", (e) => {
            e.preventDefault()

            let name = document.getElementById("milkCowName").value;
            let morning = document.getElementById("morning").value;
            let evening = document.getElementById("evening").value;
            let date = document.getElementById("date").value;
            let rate = document.getElementById("rate").value;
            // let cowerrror = document.getElementById("error");


            if (name == "" || morning == "" || evening == "" || date == "" || rate == ``) {
                alert("Fill all fields");
                return;
            }
            if (Number(rate) <= 35) {
                alert(" Min rate 35 above")
                return
            }

            let total = Number(morning) + Number(evening);
            let Entry = {
                name: name,
                morning: morning,
                evening: evening,
                date: date,
                total: total,
                rate: rate
            };

            if (editIndex == null) {
                milkEntries.push(Entry)
                localStorage.setItem("Milkentry", JSON.stringify(milkEntries))
                Swal.fire({
                    title: "Success!",
                    text: "MilkEntry Added Successfully",
                    icon: "success",
                    timer: 1500,
                    showConfirmButton: false
                });
            }
            else {
                // console.log(uptate);
                let milkEntries = JSON.parse(localStorage.getItem("Milkentry")) || [];
                let updatearr = milkEntries.map((ele, index) => {
                    if (index == editIndex) {
                        return Entry
                    } else {
                        return ele;
                    }
                })

                localStorage.setItem("Milkentry", JSON.stringify(updatearr))
                editIndex = null
                // alert("update suceesfully")
                Swal.fire({
                    title: "Updated!",
                    text: "MilkEntry Updated Successfully",
                    icon: "success",
                    timer: 1500,
                    showConfirmButton: false
                });

            }

            document.getElementById("rest").reset();
            showMilk()
        })


        function showMilk() {

            function formatDate(dateValue) {
                let d = new Date(dateValue);
                return `${String(d.getDate()).padStart(2, "0")}-${String(d.getMonth() + 1).padStart(2, "0")}-${d.getFullYear()}`;
            }
            // chatgpt---------------------------------------------------------------
            
            let milkEntries = JSON.parse(localStorage.getItem("Milkentry")) || [];
            let table = document.getElementById("milkTable");
            table.innerHTML = "";
            milkEntries.forEach((milk, index) => {
                let income = Number(milk.total) * Number(milk.rate)
                table.innerHTML += `
                 <tr>
                 <td>${formatDate(milk.date)}</td>
                  <td>${milk.name}</td>
                  <td>${milk.morning} L</td>
                  <td>${milk.evening} L</td>
                  <td>${milk.total} L</td>
                   <td>₹${milk.rate}</td>
                     <td>₹${income} </td>
                     <td><button class="btn" onclick="updatemilk(${index})"><i class="fa fa-pencil" aria-hidden="true"></i></button></td>
                     <td><button class="btn" onclick="deletemilk(${index})"><i class="fa fa-trash" aria-hidden="true"></i></button></td>
                  </tr>`;
            });
            // console.log(table);

        }
        loadCowOptions();
        showMilk()

        let deletemilk = (index) => {
            // console.log(index);

            Swal.fire({
                title: "Are you sure?",
                text: "This expense will be deleted!",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#d33",
                confirmButtonText: "Yes, Delete"

            }).then((result) => {
                if (result.isConfirmed) {
                    let milkEntries = JSON.parse(localStorage.getItem("Milkentry")) || [];
                    // console.log(milkEntries);
                    let filterentry = milkEntries.filter((ele, idx) =>
                        idx != index
                    )
                    // console.log(filterentry);
                    localStorage.setItem("Milkentry", JSON.stringify(filterentry))
                    showMilk();

                    Swal.fire({
                        title: "Deleted!",
                        text: "Expense Deleted Successfully",
                        icon: "success",
                        timer: 1500,
                        showConfirmButton: false
                    });
                }
            });

        }
        let updatemilk = (index) => {
            let milkEntries = JSON.parse(localStorage.getItem("Milkentry")) || [];
            let filterentry = milkEntries.filter((ele, idx) =>
                idx == index
            )
            console.log(filterentry);
            let [obj] = filterentry
            document.getElementById("milkCowName").value = obj.name
            document.getElementById("morning").value = obj.morning
            document.getElementById("evening").value = obj.evening
            document.getElementById("date").value = obj.date
            document.getElementById("rate").value = obj.rate
            editIndex = index
        }

        let btn = document.getElementById("modeBtn");

        btn.addEventListener("click", () => {

            document.body.classList.toggle("dark");

            if (document.body.classList.contains("dark")) {

                btn.innerHTML = `<i class="fa-solid fa-moon"></i>`

            } else {
                btn.innerHTML = `<i class="fa-solid fa-sun"></i>`

                // btn.innerHTML = "🌙 ";
            }
        });


        let admin = document.getElementById("admin")
        let userslist = JSON.parse(localStorage.getItem("userslist")) || []
        let username = userslist.map((ele) => {
            return ele.name
        })

        // console.log(username)
        admin.innerHTML = username


        let logout = document.getElementById("log")
        logout.addEventListener("click", () => {

            Swal.fire({
                title: "Are you sure?",
                text: "You want to logout?",
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Yes, Logout"
            }).then((result) => {

                if (result.isConfirmed) {

                    // remove current login user
                    localStorage.removeItem("userlist")

                    Swal.fire({
                        title: "Logged Out!",
                        icon: "success",
                        timer: 1500,
                        showConfirmButton: false
                    })

                    setTimeout(() => {
                        window.location.href = "index.html"
                    }, 1500)
                }
            })
        })


    </script>
</body>
